    popdb_fetch_retries: 3

statistics:
  pairwise_comparisons: []          # empty = all-vs-all (every model pair)
  pairwise_bootstrap_n: 500
  pairwise_bootstrap_seed: 42
  prob_threshold: 0.5
  logloss_proba_mode: auto
  bayes_bootstrap:
    n_draws: 2000

memory_safety:
  skip_memory_intensive_models: false
  lightgbm_memory_safe: true
  max_memory_mb: 8000
  batch_size: 50000
  monitor_memory: true
