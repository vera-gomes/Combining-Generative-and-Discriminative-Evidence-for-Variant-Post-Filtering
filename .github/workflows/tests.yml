name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: postfilter-pipeline --help
      - run: pytest -m "not slow" -q

  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -m slow -q

  results:
    # every table of the paper must be regenerated identically from results/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas matplotlib
      - run: >
          python scripts/make_results.py --reeval results/external_validation --train results/train
          --clinvar-records results/external_validation/clinvar_records_in_callset.csv.gz
          --tables /tmp/tables --figures /tmp/figures
      - run: python scripts/make_supp_extra.py --results results --tables /tmp/tables
      - run: python scripts/fig_alpha_three.py --results results --out /tmp/figures/fig_alpha_three
