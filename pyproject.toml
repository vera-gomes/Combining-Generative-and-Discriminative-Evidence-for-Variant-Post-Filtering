[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "postfilter-pipeline"
version = "0.1.0"
description = "Caller-agnostic variant post-filtering pipeline combining generative and discriminative evidence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Vera Pinto", email = "vgpinto@ciencias.ulisboa.pt" },
    { name = "Lisete Sousa" },
    { name = "Carina Silva" },
]
keywords = ["bioinformatics", "variant-calling", "vcf", "machine-learning", "genomics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "pysam>=0.22",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
bayes = ["optuna>=3.4"]
skopt = ["scikit-optimize>=0.9"]
excel = ["openpyxl>=3.1"]
memory = ["psutil>=5.9"]
full = [
    "optuna>=3.4",
    "scikit-optimize>=0.9",
    "openpyxl>=3.1",
    "psutil>=5.9",
]

[project.urls]
Homepage = "https://github.com/vera-gomes/Combining-Generative-and-Discriminative-Evidence-for-Variant-Post-Filtering"
Repository = "https://github.com/vera-gomes/Combining-Generative-and-Discriminative-Evidence-for-Variant-Post-Filtering"

[project.scripts]
postfilter-pipeline = "postfilter_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
