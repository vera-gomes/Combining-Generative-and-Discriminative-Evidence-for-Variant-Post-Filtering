mode: apply

paths:
  apply_input_vcf: /home/ceaul/Documents/NA06985.grch38.g.vcf.gz
  trained_model_dir: /home/ceaul/Documents/deep_v2   # ← point to your training output
  output_dir: /home/ceaul/Documents/deep_v2          # apply creates a timestamped subdir

features:
  - MQ
  - QD
  - FS
  - SOR
  - MQRankSum
  - ReadPosRankSum
  - BaseQRankSum
  - DP

evaluation:
  primary_sensitivity: 0.999
  variant_classification_target_sens: 0.99
  apply_stats_max_n: 30000          # subsample size for bootstrap — keeps PopDB bootstrap ~17h
  min_class_n_for_bootstrap: 30     # skip bootstrap if minority class < 30 (covers ClinVar on single-sample VCF)

  external_validation:
    enabled: true

    clinvar:
      enabled: true
      vcf: https://ftp.ncbi.nlm.nih.gov/pub/clinvar/vcf_GRCh38/clinvar.vcf.gz

